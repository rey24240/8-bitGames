<div id="status-box" style="position:fixed;bottom:10px;left:120px;color:#39ff14;background:rgba(0,0,0,0.85);padding:14px 24px;border-radius:12px;z-index:9999;font-family:monospace;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,0.2);display:flex;flex-direction:column;align-items:center;gap:6px;">
  <span id="fps-counter">FPS: 0</span>
  <span id="clock">12:00 AM</span>
</div>
<script>
  // Real-Time Clock
  function updateClock() {
    const now = new Date();
    const time = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    const clockElem = document.getElementById('clock');
    if (clockElem) {
      clockElem.textContent = time;
    }
  }
  setInterval(updateClock, 1000);
  updateClock();

  // FPS Counter
  let lastFrame = performance.now();
  let frames = 0;
  let fps = 0;
  function updateFPS() {
    frames++;
    const now = performance.now();
    if (now - lastFrame >= 1000) {
      fps = frames;
      frames = 0;
      lastFrame = now;
      const fpsElem = document.getElementById('fps-counter');
      if (fpsElem) {
        fpsElem.textContent = `FPS: ${fps}`;
      }
    }
    requestAnimationFrame(updateFPS);
  }
  updateFPS();
</script>

        <!-- Popup Container -->
        <div id="popupContainer">
          <div id="popupContent">
            <span id="closeButton">&times;</span>
            <h2>New Site!</h2>
            <h1></h1>
            <p></p>
              
           
            <p></p>
            <p> </p>
            <button onclick="closePopup()">Close</button>
          </div>
        </div>
        
        <script>
          // Function to show the popup
          function showPopup() {
            document.getElementById("popupContainer").style.display = "block";
            localStorage.setItem('popupShown', 'true'); // Set flag in local storage
          }
        
          // Function to close the popup
          function closePopup() {
            document.getElementById("popupContainer").style.display = "none";
          }
        
          // Check if the popup has already been shown
          window.onload = function() {
            if (localStorage.getItem('popupShown') !== 'true') {
              // Show the popup after a delay (e.g., 1 seconds)
              setTimeout(showPopup, 1000);
            }
          };
        
          // Add event listener to the close button
          document.getElementById("closeButton").addEventListener("click", closePopup);
        </script>
