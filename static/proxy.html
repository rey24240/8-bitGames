        <!-- FPS Counter -->
        <div id="fps-counter" style="position:fixed;bottom:10px;right:10px;color:white;background:black;padding:5px 10px;border-radius:5px;z-index:9999;font-family:monospace;"></div>
        <!-- Real-time Date and Time -->

    
<script>
// FPS Counter Script
let lastFrame = performance.now();
let frames = 0;
let fps = 0;
function updateFPS() {
    frames++;
    const now = performance.now();
    if (now - lastFrame >= 1000) {
        fps = frames;
        frames = 0;
        lastFrame = now;
        document.getElementById('fps-counter').textContent = `FPS: ${fps}`;
    }
    requestAnimationFrame(updateFPS);
}
updateFPS();
</script>
