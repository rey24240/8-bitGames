<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <script src="/assets/js/font.js"></script>
    <meta name="google" content="notranslate" />
    <link rel="stylesheet" type="text/css" href="/assets/css/style.css?v=1" />
    <link rel="stylesheet" href="/assets/css/sidebar.css?v=3" />
    <title>Google Classroom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Rednotsus" />
    <meta http-equiv="Cache-control" content="public">
    <meta charset="utf-8">
    <link rel="stylesheet" href="/assets/css/gameframe.css?v=3" />
    <script src="/assets/js/script.js?v=11"></script>
</head>

<body>
   <div class="sidebar">
    <!-- Logo at the top of the sidebar with link -->
    <a href="index.html" class="logo-link">
        <img class="logo" src="img/profile.png">
    </a>
    
    <!-- Divider line -->
    <div class="divider"></div>

    <!-- Navigation items -->
    <div class="nav-item selected">
        <a href="apps.html">
            <i class="fa fa-home" style="color:white;"></i>
        </a>
    </div>
    <div class="nav-item">
              <a href="games.html">
        <i class="bi bi-grid-fill"style="color:gray;"></i>
    </div>
    <div class="nav-item">
        <i class="fa-solid fa-gamepad"></i>
    </div>
    
    <!-- Divider line before About and Settings -->
    <div class="divider"></div>

    <!-- New "About" and "Settings" buttons at the bottom -->
    <div class="nav-item">
        <a href="Aboutpage.html">
            <i class="fa fa-circle-info" style="color:gray;"></i>
        </a>
    </div>
    <div class="nav-item">
        <a href="settings.html">
            <i class="fa fa-cogs" style="color:gray;"></i>
        </a>
    </div>
</div>

    <div id="gameframe">
        <div class="gameDisplay">
            <div class="game">
                <iframe id="iframe" src="https://infinite-craft.com/infinite-craft/"></iframe>
            </div>
            <div class="options">
                <div class="left">
                    <div class="gametext">
                        <img src="/img/games/1v1loll.png" class="gameicon" />
                        <div class="margin">
                            <div class="flex">
                                <h1 class="titletext">1v1.lol</h1>
                            </div>
                            <span class="bytext">By JustPlay.LOL</span>
                        </div>
                    </div>
                </div>
                <div class="right">
                    <i class="fa-solid fa-rotate-right reloadbtn" id="reloadbtn"></i>
                    <i class="fa-solid fa-expand fullscreenbtn" onclick="fullscreen();"></i>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/uv/uv.bundle.js" defer></script>
<script src="assets/uv/uv.config.js?cdn" defer></script>
    
    <script>
        var elem = document.getElementById("iframe");

        function fullscreen() {
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }
        function reload() {
            document.getElementById("iframe").src += "";
        }
        reloadbtn.onclick = reload;
    </script>
</body>

</html>
