<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" />
    <script src="/assets/js/font.js"></script>
    <meta name="google" content="notranslate" />
    <link rel="stylesheet" type="text/css" href="/assets/css/style.css?v=1" />
    <link rel="stylesheet" href="/assets/css/nav.css?v=3" />
    <title>Google Classroom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Rednotsus" />
    <meta http-equiv="Cache-control" content="public">
    <meta charset="utf-8">
    <link rel="stylesheet" href="/assets/css/gameframe.css?v=3" />
    <script src="/assets/js/script.js?v=11"></script>
</head>

<body>
    <nav>
        <div class="navbar">
            <a id="nav-title" href="/">Emerald Games</a>
            <a href="/g"><i class="fa-solid fa-gamepad">&nbsp;</i>Games</a>
            <a href="/a"><i class="fa-solid fa-box-archive">&nbsp;</i>Apps</a>
            <a href="/-"><i class="fa-solid fa-tv">&nbsp;</i>Movies</a>
            <a href="/s"><i class="fa-solid fa-gears">&nbsp;</i>Settings</a>
        </div>
    </nav>

    <div id="gameframe">
        <div class="gameDisplay">
            <div class="game">
                <iframe id="iframe" src="/misc/rowdy-city-wrestling/rowdy-city-wrestling"></iframe>
            </div>
            <div class="options">
                <div class="left">
                    <div class="gametext">
                        <img src="/img/games/Rowdy City Wrestling.jpeg" class="gameicon" />
                        <div class="margin">
                            <div class="flex">
                                <h1 class="titletext">Rowdy City Wrestling</h1>
                            </div>
                            <span class="bytext">By Colin Lane Games</span>
                        </div>
                    </div>
                </div>
                <div class="right">
                    <i class="fa-solid fa-rotate-right reloadbtn" id="reloadbtn"></i>
                    <i class="fa-solid fa-expand fullscreenbtn" onclick="fullscreen();"></i>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        var elem = document.getElementById("iframe");

        function fullscreen() {
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }
        function reload() {
            document.getElementById("iframe").src += "";
        }
        reloadbtn.onclick = reload;
    </script>
</body>

</html>
