  <style>
    :root { --sidebar-offset: 220px; }

    body{
      margin:0;
      font-family: Roboto, Arial, sans-serif;
      background: var(--bg-color,#07040a);
      color: var(--text-color,#fff);
      min-height:100vh;
      box-sizing:border-box;
    }

    /* layout: sidebar + centered content column to the right */
    .page-wrapper{
      margin-left: var(--sidebar-offset);
      padding: 24px;
      width: calc(100% - var(--sidebar-offset));
      box-sizing: border-box;
      display: flex;
      justify-content: center; /* center horizontally */
      align-items: flex-start;  /* keep top */
      padding-top: 20px;
    }

    main{
      width: 920px;
      max-width: calc(100% - 40px);
      text-align: center;
    }

    /* top header */
    .header-gear { font-size:38px; color:var(--primary-color); display:block; margin: 8px auto 6px; }
    .settings-title { font-size:32px; color:var(--primary-color); margin:0 0 18px; font-weight:700; text-align:center; }

    /* small tab row */
    .tabs-container { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
    .tab-button {
      padding:8px 12px;
      border-radius:10px;
      border:1px solid var(--border-color);
      background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(0,0,0,0.03));
      color:var(--text-color);
      font-weight:700;
      cursor:pointer;
    }
    .tab-button.active { background: var(--accent-color); color:var(--text-color); transform:scale(1.03); }

    /* top quick buttons row */
    .quick-buttons { display:flex; justify-content:center; gap:16px; margin-bottom:18px; }
    .quick-btn{
      padding:10px 18px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      min-width:160px;
      border:1px solid rgba(255,255,255,0.06);
      background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(0,0,0,0.04));
      color:var(--text-color);
    }
    .quick-btn.appearance { background:linear-gradient(90deg,var(--primary-color),var(--secondary-color,#7c3be6)); color:#fff; border:none; }
    .quick-btn.account { background:transparent; border:1px solid var(--border-color); }

    /* Themes box */
    .themes-box{
      background: var(--bg-2-color);
      border:2px solid var(--border-color);
      border-radius:12px;
      padding:32px;
      text-align:center;
      box-shadow:0 8px 24px rgba(0,0,0,0.45);
      margin-top:8px;
    }
    .themes-title{ font-size:20px; margin:0 0 8px; font-weight:700; color:var(--text-color); }
    .themes-desc{ color:var(--text-secondary-color); margin:0 0 16px; }

    /* dropdown */
    .dropdown{ display:inline-block; position:relative; text-align:left; }
    .dropdown-btn{
      padding:10px 14px;
      border-radius:10px;
      border:1px solid var(--border-color);
      background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(0,0,0,0.04));
      color:var(--text-color);
      cursor:pointer;
      min-width:220px;
      font-weight:700;
    }
    .dropdown-menu{
      position:absolute;
      right:0;
      top:calc(100% + 8px);
      background:var(--bg-2-color);
      border:1px solid var(--border-color);
      border-radius:8px;
      min-width:220px;
      box-shadow:0 8px 24px rgba(0,0,0,0.5);
      overflow:hidden;
      z-index:60;
    }
    .dropdown-item{ padding:10px 12px; cursor:pointer; font-weight:700; color:var(--text-color); }
    .dropdown-item:hover{ background: rgba(255,255,255,0.02); }

    /* card and form controls */
    .card.settings-card{
      animation: slideUp 0.3s ease;
      background:var(--bg-2-color);
      border:2px solid var(--border-color);
      border-radius:var(--border-radius);
      padding:2rem;
      margin:1rem 0;
      box-shadow:0 4px 20px rgba(0,0,0,0.1);
      text-align:center;
    }
    .settings-item{ display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:1rem; }
    label{ font-weight:600; color:var(--text-color); margin-bottom:6px; }
    select#theme-select{
      padding:0.75rem 1rem; border:2px solid var(--border-color); border-radius:var(--border-radius);
      background:var(--bg-2-color); color:var(--text-color); min-width:240px; font-size:1rem;
    }

    @media (max-width:900px){
      .page-wrapper{ margin-left:16px; width: calc(100% - 16px); padding:16px; }
      .themes-box{ padding:20px; }
      .dropdown-btn, .dropdown-menu, select#theme-select{ min-width:160px; }
    }

    @keyframes slideUp{ from{ transform:translateY(8px); opacity:0 } to{ transform:translateY(0); opacity:1 } }
  </style>
</head>

  <script src="/assets/js/theme.js"></script>
  <script>
    (function(){
      const STORAGE_KEY = 'theme';
      const select = document.getElementById('theme-select');

      function setTheme(value){
        if(!value || value === 'default'){
          document.body.removeAttribute('theme');
          try{ localStorage.setItem(STORAGE_KEY,'default'); }catch{}
        } else {
          document.body.setAttribute('theme', value);
          try{ localStorage.setItem(STORAGE_KEY, value); }catch{}
        }
        if(select) select.value = value === 'default' ? 'default' : value;
      }

      // initialize from storage
      try{
        const saved = localStorage.getItem(STORAGE_KEY) || 'default';
        if(saved && saved !== 'default') document.body.setAttribute('theme', saved);
        if(select) select.value = saved;
      }catch(e){ /* ignore */ }

      // select change
      if(select){
        select.addEventListener('change', e => setTheme(e.target.value));
      }

      // tabs logic
      const tabButtons = document.querySelectorAll('.tab-button');
      const tabs = document.querySelectorAll('.tab');
      function showTab(key){
        tabs.forEach(t => t.hidden = !(t.dataset.tabName === key));
        tabButtons.forEach(b => b.classList.toggle('active', b.id === key+'-tab'));
      }
      tabButtons.forEach(b => b.addEventListener('click', ()=> showTab(b.id.replace('-tab',''))));
      showTab('style');
    })();
  </script>
