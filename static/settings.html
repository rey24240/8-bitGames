<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Settings</title>
    <script src="/assets/js/font.js"></script>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <link rel="stylesheet" href="/assets/css/sidebar.css?v=3" />
  <style>
    :root { --sidebar-offset: 220px; }

    body{
      margin:0;
      font-family: Roboto, Arial, sans-serif;
      background: var(--bg-color,#07040a);
      color: var(--text-color,#fff);
      min-height:100vh;
      box-sizing:border-box;
    }

    /* layout: sidebar + centered content column to the right */
    .page-wrapper{
      margin-left: var(--sidebar-offset);
      padding: 24px;
      width: calc(100% - var(--sidebar-offset));
      box-sizing: border-box;
      display: flex;
      justify-content: center; /* center horizontally */
      align-items: flex-start;  /* keep top */
      padding-top: 20px;
    }

    main{
      width: 920px;
      max-width: calc(100% - 40px);
      text-align: center;
    }

    /* top header */
    .header-gear { font-size:38px; color:var(--primary-color); display:block; margin: 8px auto 6px; }
    .settings-title { font-size:32px; color:var(--primary-color); margin:0 0 18px; font-weight:700; text-align:center; }

    /* small tab row */
    .tabs-container { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
    .tab-button {
      padding:8px 12px;
      border-radius:10px;
      border:1px solid var(--border-color);
      background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(0,0,0,0.03));
      color:var(--text-color);
      font-weight:700;
      cursor:pointer;
    }
    .tab-button.active { background: var(--accent-color); color:var(--text-color); transform:scale(1.03); }

    /* top quick buttons row */
    .quick-buttons { display:flex; justify-content:center; gap:16px; margin-bottom:18px; }
    .quick-btn{
      padding:10px 18px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      min-width:160px;
      border:1px solid rgba(255,255,255,0.06);
      background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(0,0,0,0.04));
      color:var(--text-color);
    }
    .quick-btn.appearance { background:linear-gradient(90deg,var(--primary-color),var(--secondary-color,#7c3be6)); color:#fff; border:none; }
    .quick-btn.account { background:transparent; border:1px solid var(--border-color); }

    /* Themes box */
    .themes-box{
      background: var(--bg-2-color);
      border:2px solid var(--border-color);
      border-radius:12px;
      padding:32px;
      text-align:center;
      box-shadow:0 8px 24px rgba(0,0,0,0.45);
      margin-top:8px;
    }
    .themes-title{ font-size:20px; margin:0 0 8px; font-weight:700; color:var(--text-color); }
    .themes-desc{ color:var(--text-secondary-color); margin:0 0 16px; }

    /* dropdown */
    .dropdown{ display:inline-block; position:relative; text-align:left; }
    .dropdown-btn{
      padding:10px 14px;
      border-radius:10px;
      border:1px solid var(--border-color);
      background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(0,0,0,0.04));
      color:var(--text-color);
      cursor:pointer;
      min-width:220px;
      font-weight:700;
    }
    .dropdown-menu{
      position:absolute;
      right:0;
      top:calc(100% + 8px);
      background:var(--bg-2-color);
      border:1px solid var(--border-color);
      border-radius:8px;
      min-width:220px;
      box-shadow:0 8px 24px rgba(0,0,0,0.5);
      overflow:hidden;
      z-index:60;
    }
    .dropdown-item{ padding:10px 12px; cursor:pointer; font-weight:700; color:var(--text-color); }
    .dropdown-item:hover{ background: rgba(255,255,255,0.02); }

    /* card and form controls */
    .card.settings-card{
      animation: slideUp 0.3s ease;
      background:var(--bg-2-color);
      border:2px solid var(--border-color);
      border-radius:var(--border-radius);
      padding:2rem;
      margin:1rem 0;
      box-shadow:0 4px 20px rgba(0,0,0,0.1);
      text-align:center;
    }
    .settings-item{ display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:1rem; }
    label{ font-weight:600; color:var(--text-color); margin-bottom:6px; }
    select#theme-select{
      padding:0.75rem 1rem; border:2px solid var(--border-color); border-radius:var(--border-radius);
      background:var(--bg-2-color); color:var(--text-color); min-width:240px; font-size:1rem;
    }

    @media (max-width:900px){
      .page-wrapper{ margin-left:16px; width: calc(100% - 16px); padding:16px; }
      .themes-box{ padding:20px; }
      .dropdown-btn, .dropdown-menu, select#theme-select{ min-width:160px; }
    }

    @keyframes slideUp{ from{ transform:translateY(8px); opacity:0 } to{ transform:translateY(0); opacity:1 } }
  </style>
</head>
<body>
  <!-- INDEX SIDEBAR -->
  <div class="sidebar" aria-label="Main sidebar">
    <a href="/index.html" class="logo-link">
      <img class="logo" src="/img/images.png" alt="logo">
    </a>

    <div class="divider"></div>

    <div class="nav-item selected">
      <a href="/apps.html" title="Apps"><i class="fa fa-home" style="color:white;"></i></a>
    </div>
    <div class="nav-item">
      <a href="/games.html" title="Games"><i class="bi bi-grid-fill" style="color:white;"></i></a>
    </div>
    <div class="nav-item">
      <a href="/play.html" title="Play"><i class="fa-solid fa-gamepad" style="color:white;"></i></a>
    </div>

    <div class="divider"></div>

    <div class="nav-item">
      <a href="/Aboutpage.html" title="About"><i class="fa fa-circle-info" style="color:white;"></i></a>
    </div>
    <div class="nav-item">
      <a href="/settings.html" title="Settings"><i class="fa fa-cogs" style="color:white;"></i></a>
    </div>
  </div>

  <div class="page-wrapper" role="main" aria-label="Settings page">
    <main>
      <i class="fa-solid fa-gear header-gear" aria-hidden="true"></i>
      <h1 class="settings-title">Settings</h1>

      <div class="tabs-container" id="tabs-container">
        <button class="tab-button" id="style-tab">Appearance</button>
        <button class="tab-button" id="proxy-tab">Proxy</button>
        <button class="tab-button" id="cloak-tab">Cloak</button>
        <button class="tab-button" id="other-tab">Other</button>
      </div>

      <div class="quick-buttons" aria-hidden="false">
        <button class="quick-btn account" id="quick-account">Account</button>
        <button class="quick-btn appearance" id="quick-appearance">Appearance</button>
      </div>

      <!-- Appearance tab -->
      <div data-tab-name="style" class="tab">
        <div class="card settings-card">
          <h2 style="margin:0 0 6px 0">Themes</h2>
          <p class="themes-desc">Choose a site theme (from themes.css).</p>

          <div class="themes-box" id="themes-box" aria-label="Themes box">
            <div class="themes-title">Themes</div>
            <div class="themes-desc">Pick a theme below.</div>

            <div style="margin-top:12px;">
              <div class="dropdown" id="theme-dropdown">
                <button class="dropdown-btn" id="dropdown-toggle">Select Theme ▾</button>
                <div class="dropdown-menu" id="dropdown-menu" hidden aria-hidden="true">
                  <div class="dropdown-item" data-theme="halloween">Halloween</div>
                  <div class="dropdown-item" data-theme="christmas">Christmas</div>
                  <div class="dropdown-item" data-theme="v6">V6</div>
                  <div class="dropdown-item" data-theme="">Default</div>
                </div>
              </div>
            </div>

            <div style="margin-top:18px;">
              <div class="settings-item">
                <label for="theme-select">Or select (from themes.css)</label>
                <select id="theme-select" class="input" aria-label="Theme select">
                  <option value="default">Default</option>
                  <option value="v6">V6</option>
                  <option value="halloween">Halloween</option>
                  <option value="christmas">Christmas</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Proxy / Cloak / Other tabs -->
      <div data-tab-name="proxy" class="tab" hidden>
        <div class="card settings-card"><h2 style="margin:0">Proxy</h2><p style="color:var(--text-secondary-color)">Proxy settings go here.</p></div>
      </div>

      <div data-tab-name="cloak" class="tab" hidden>
        <div class="card settings-card"><h2 style="margin:0">Cloak</h2><p style="color:var(--text-secondary-color)">Cloak settings go here.</p></div>
      </div>

      <div data-tab-name="other" class="tab" hidden>
        <div class="card settings-card"><h2 style="margin:0">Other</h2><p style="color:var(--text-secondary-color)">Other settings go here.</p></div>
      </div>
    </main>
  </div>

  <script>
    (function(){
      const STORAGE_KEY = 'site-theme';
      const select = document.getElementById('theme-select');
      const dropdownToggle = document.getElementById('dropdown-toggle');
      const dropdownMenu = document.getElementById('dropdown-menu');

      // list of CSS variables to copy from body[theme] into :root so "every color" updates
      const THEME_VARS = [
        '--primary-color','--secondary-color','--accent-color',
        '--bg-2-color','--bg-color','--text-color','--text-secondary-color',
        '--text-placeholder-color','--border-color','--border-radius',
        '--blob-1','--blob-2','--blob-3'
      ];

      // copy computed theme variables from body into :root (documentElement)
      function syncThemeVarsToRoot() {
        // short delay to let CSS cascade after changing attribute
        requestAnimationFrame(() => {
          const computed = getComputedStyle(document.body);
          THEME_VARS.forEach(name => {
            const val = (computed.getPropertyValue(name) || '').trim();
            if (val) {
              document.documentElement.style.setProperty(name, val);
            } else {
              // if not present on body, remove any inline override on :root
              document.documentElement.style.removeProperty(name);
            }
          });
        });
      }

      function setTheme(value){
        if(!value || value === 'default'){
          document.body.removeAttribute('theme');
          try{ localStorage.setItem(STORAGE_KEY,'default'); }catch{}
        } else {
          document.body.setAttribute('theme', value);
          try{ localStorage.setItem(STORAGE_KEY, value); }catch{}
        }
        // copy variables so everything using CSS vars updates instantly
+        syncThemeVarsToRoot();
        // update labels
        const label = value && value !== 'default' ? value.charAt(0).toUpperCase() + value.slice(1) : 'Default';
        dropdownToggle.textContent = label + ' ▾';
        if(select) select.value = value === 'default' ? 'default' : value;
      }

      // initialize from storage
      try{
        const saved = localStorage.getItem(STORAGE_KEY) || 'default';
        if(saved && saved !== 'default') document.body.setAttribute('theme', saved);
+        // ensure root vars reflect initial theme
+        syncThemeVarsToRoot();
        if(select) select.value = saved;
        dropdownToggle.textContent = (saved && saved !== 'default') ? (saved.charAt(0).toUpperCase()+saved.slice(1)) + ' ▾' : 'Select Theme ▾';
      }catch(e){ /* ignore */ }

      // select change
      if(select){
        select.addEventListener('change', e => setTheme(e.target.value));
      }

      // dropdown logic
      dropdownToggle.addEventListener('click', e=>{
        e.stopPropagation();
        const hidden = dropdownMenu.hasAttribute('hidden');
        if(hidden){ dropdownMenu.removeAttribute('hidden'); dropdownMenu.setAttribute('aria-hidden','false'); }
        else { dropdownMenu.setAttribute('hidden',''); dropdownMenu.setAttribute('aria-hidden','true'); }
      });
      document.addEventListener('click', ()=> {
        if(!dropdownMenu.hasAttribute('hidden')) { dropdownMenu.setAttribute('hidden',''); dropdownMenu.setAttribute('aria-hidden','true'); }
      });
      dropdownMenu.querySelectorAll('.dropdown-item').forEach(item=>{
        item.addEventListener('click', ()=>{
          const theme = item.getAttribute('data-theme') || '';
          setTheme(theme || 'default');
          dropdownMenu.setAttribute('hidden','');
          dropdownMenu.setAttribute('aria-hidden','true');
        });
      });

      // quick buttons
      document.getElementById('quick-appearance').addEventListener('click', ()=> {
        // focus themes box
        document.getElementById('themes-box').scrollIntoView({behavior:'smooth', block:'center'});
      });
      document.getElementById('quick-account').addEventListener('click', ()=> {
        alert('Open account settings');
      });

      // tabs logic
      const tabButtons = document.querySelectorAll('.tab-button');
      const tabs = document.querySelectorAll('.tab');
      function showTab(key){
        tabs.forEach(t => t.hidden = !(t.dataset.tabName === key));
        tabButtons.forEach(b => b.classList.toggle('active', b.id === key+'-tab'));
      }
      tabButtons.forEach(b => b.addEventListener('click', ()=> showTab(b.id.replace('-tab',''))));
      showTab('style');
    })();
  </script>
</body>
</html>
