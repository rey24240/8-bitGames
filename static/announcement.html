<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Alt Proxy Game Frame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background: var(--bg-color);
      margin: 0;
      height: 100vh;
      color: var(--text-color);
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .frame-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    iframe {
      border: 4px solid var(--primary-color);
      border-radius: 12px;
      width: 90vw;
      height: 85vh;
      background: var(--bg-2-color);
      box-shadow: 0 0 24px var(--primary-color)88;
    }
    h1 {
      margin-bottom: 16px;
      color: var(--primary-color);
      text-shadow: 1px 1px 8px var(--text-secondary-color);
    }
  </style>
</head>
<body>
  <div class="frame-container">
    <h1>Alt Proxy Game Frame</h1>
    <iframe id="gameFrame" src="" allowfullscreen></iframe>
  </div>
  <script>
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }
    const gameUrl = getQueryParam('url');
    if (gameUrl) {
      document.getElementById('gameFrame').src = gameUrl;
    }
  </script>
</body>
</html>
