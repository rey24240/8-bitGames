    <script>
        var elem = document.getElementById("iframeid");

        function fullscreen() {
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }
        function reload() {
            document.getElementById("iframeid").src += "";
        }
        reloadbtn.onclick = reload;

        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                // Reset iframe styles when exiting fullscreen to fix bug
                elem.style.width = '';
                elem.style.height = '';
                elem.style.position = '';
                elem.style.top = '';
                elem.style.left = '';
            }
        });
    </script>

<script>
// FPS Counter Script
let lastFrame = performance.now();
let frames = 0;
let fps = 0;
function updateFPS() {
    frames++;
    const now = performance.now();
    if (now - lastFrame >= 1000) {
        fps = frames;
        frames = 0;
        lastFrame = now;
        document.getElementById('fps-counter').textContent = `FPS: ${fps}`;
    }
    requestAnimationFrame(updateFPS);
}
updateFPS();
</script>
<!-- Auto-fill game title from games.json -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    try {
        const img = document.querySelector('.gameicon');
        if (!img) return;
        // Normalize image pathname
        const imgPath = (function () {
            try { return new URL(img.src, location.origin).pathname; } catch (e) { return img.getAttribute('src'); }
        })();

        fetch('/assets/json/games.json')
            .then(function (res) { return res.json(); })
            .then(function (games) {
                const filename = imgPath.split('/').pop();
                                var match = games.find(function (g) {
                                        if (!g.image) return false;
                                        // compare by filename or full path
                                        var gImgPath;
                                        try { gImgPath = new URL(g.image, location.origin).pathname; } catch (e) { gImgPath = g.image; }
                                        return gImgPath === imgPath || gImgPath.split('/').pop() === filename;
                                });
                                // Fallbacks: try matching by sessionStorage gameUrl first
                                if (!match) {
                                    var gameUrl = sessionStorage.getItem("gameUrl");
                                    if (gameUrl) {
                                        match = games.find(function (g) {
                                            return g.url === gameUrl;
                                        });
                                    }
                                }
                                if (!match) {
                                    // try matching by URL filename (useful if the iframe or page encodes the game)
                                    var iframe = document.getElementById('iframeid') || document.getElementById('iframe');
                                    var iframePath = '';
                                    try { iframePath = iframe && new URL(iframe.src, location.origin).pathname; } catch (e) { iframePath = iframe && iframe.getAttribute && iframe.getAttribute('src') || ''; }
                                    var iframeFile = iframePath.split('/').pop();
                                    if (iframeFile) {
                                        match = games.find(function (g) {
                                            if (!g.url) return false;
                                            try {
                                                var gUrlPath = new URL(g.url, location.origin).pathname;
                                                return gUrlPath.split('/').pop() === iframeFile || g.url.includes(iframeFile);
                                            } catch (e) {
                                                return (g.url || '').includes(iframeFile);
                                            }
                                        });
                                    }
                                }
                                if (!match) {
                                    var currentTitle = (document.querySelector('.titletext') || {}).textContent || '';
                                    currentTitle = currentTitle && currentTitle.trim();
                                    if (currentTitle) {
                                        match = games.find(function (g) {
                                            return g.name && g.name.trim().toLowerCase() === currentTitle.toLowerCase();
                                        });
                                    }
                                }
                        if (match) {
                            var titleEl = document.querySelector('.titletext');
                            if (titleEl) titleEl.textContent = match.name;
                            var byEl = document.querySelector('.bytext');
                            if (byEl && match.creator) byEl.textContent = "By " + match.creator;
                            // Update the displayed game image if the JSON provides one
                            if (match.image) {
                                var icon = document.querySelector('.gameicon');
                                if (icon) icon.src = match.image;
                            }
                            // If there's an iframe showing the game, set its src from the JSON (if present)
                            try {
                            if (match.usesProxy && match.url) {
                                try {
                                    if (window.__uv$config && typeof __uv$config.encodeUrl === 'function') {
                                        const encoded = __uv$config.encodeUrl(match.url);
                                        const proxied = (__uv$config.prefix || '/assets/uv/service/') + encoded;
                                        const iframe = document.getElementById('iframeid') || document.getElementById('iframe');
                                        if (iframe) iframe.src = proxied;
                                    } else if (window.__uv && typeof __uv.encodeUrl === 'function') {
                                        // fallback if different global
                                        const encoded = __uv.encodeUrl(match.url);
                                        const proxied = (__uv$config && __uv$config.prefix ? __uv$config.prefix : '/assets/uv/service/') + encoded;
                                        const iframe = document.getElementById('iframeid') || document.getElementById('iframe');
                                        if (iframe) iframe.src = proxied;
                                    }
                                } catch (e) {
                                    console.warn('Failed to set proxied iframe src', e);
                                }
                            } else {
                                var iframe = document.getElementById('iframeid') || document.getElementById('iframe');
                                if (iframe && match.url) {
                                    iframe.src = match.url;
                                }
                                }
                            } catch (e) { /* ignore cross-origin or missing iframe */ }
                        }
            })
            .catch(function (err) { console.warn('Failed to load games.json', err); });
    } catch (e) { console.warn('Auto-fill title failed', e); }
});
</script>
